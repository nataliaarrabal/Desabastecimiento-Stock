# Descarga diaria de desabastecimientos (AEMPS + EMA), enriquecimiento con CIMA
# y guardado de los resultados en el propio repositorio.

name: Descarga diaria

on:
  schedule:
    # Hora UTC: 08:17 UTC = 09:17 en Madrid en invierno (10:17 en verano)
    - cron: "17 8 * * *"
  workflow_dispatch: # permite lanzarlo a mano desde la pestaña Actions

permissions:
  contents: write # necesario para hacer commit de los datos

jobs:
  descargar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Descargar datos de AEMPS y EMA
        run: python descarga_diaria.py

      - name: Enriquecer con CIMA y limpiar
        run: python enriquecer_aemps.py

      - name: Actualizar histórico (nuevos y resueltos)
        run: python historico.py

      - name: Guardar los datos en el repositorio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add datos_raw datos_limpios datos_cima
          if git diff --cached --quiet; then
            echo "No hay datos nuevos"
          else
            git commit -m "Datos del $(date -u +%Y-%m-%d)"
            git push
          fi
