# Descarga diaria de desabastecimientos (AEMPS + EMA), enriquecimiento con CIMA
# y guardado de los resultados en el propio repositorio.

name: Descarga diaria

on:
  schedule:
    # Tres intentos al día (hora UTC; Madrid = UTC+1 en invierno, UTC+2 en verano).
    # GitHub a veces retrasa o se salta las tareas programadas: si la primera no se
    # ejecuta, la siguiente recupera el día. No se duplica nada, porque el script no
    # vuelve a descargar un día que ya tiene y solo se guarda si hay datos nuevos.
    - cron: "17 8 * * *"
    - cron: "47 12 * * *"
    - cron: "23 17 * * *"
  workflow_dispatch: # permite lanzarlo a mano desde la pestaña Actions

permissions:
  contents: write # necesario para hacer commit de los datos

jobs:
  descargar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Descargar datos de AEMPS y EMA
        run: python descarga_diaria.py

      - name: Enriquecer con CIMA y limpiar
        run: python enriquecer_aemps.py

      - name: Actualizar histórico (nuevos y resueltos)
        run: python historico.py

      - name: Buscar alternativas por principio activo
        run: python alternativas.py

      - name: Guardar los datos en el repositorio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add datos_raw datos_limpios datos_cima
          if git diff --cached --quiet; then
            echo "No hay datos nuevos"
          else
            git commit -m "Datos del $(date -u +%Y-%m-%d)"
            git push
          fi
